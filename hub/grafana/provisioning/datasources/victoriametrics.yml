apiVersion: 1

datasources:
  - name: VictoriaMetrics
    uid: victoriametrics          # fixed uid: dashboards reference it
    type: prometheus              # VM is PromQL-compatible; no plugin needed
    access: proxy
    url: http://victoriametrics:8428
    isDefault: true
    editable: false
    basicAuth: true
    basicAuthUser: vmagent
    jsonData:
      timeInterval: 30s           # = scrape interval, makes $__rate_interval correct
      httpMethod: POST
      prometheusType: Prometheus
    secureJsonData:
      basicAuthPassword: $__file{/run/secrets/vm_password}
