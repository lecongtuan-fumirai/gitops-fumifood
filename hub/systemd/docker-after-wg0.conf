# Install: mkdir -p /etc/systemd/system/docker.service.d
#          cp hub/systemd/docker-after-wg0.conf /etc/systemd/system/docker.service.d/10-after-wg0.conf
#          systemctl daemon-reload      (no docker restart needed; takes effect at next boot)
#
# VictoriaMetrics/Grafana publish on 10.66.66.1. If dockerd starts before wg0
# has that address, the port bind fails and the container stays down after a
# reboot. Wants= (not Requires=) so a broken wg0 never prevents n8n etc. from starting.
[Unit]
Wants=wg-quick@wg0.service
After=wg-quick@wg0.service
