# Meta alerts: is the monitoring pipeline itself healthy?
groups:
  - name: meta
    interval: 30s
    rules:
      # Always firing. Alertmanager routes it to healthchecks.io every minute.
      # If the hub, vmalert, Alertmanager or the hub's internet dies, the pings
      # stop and healthchecks.io notifies you (dead man's switch).
      - alert: Watchdog
        expr: vector(1)
        labels: { severity: none }
        annotations:
          summary: "Heartbeat of the alerting pipeline (expected to always fire)"

      # No fresh data from vn1-01: cluster down, WireGuard tunnel down, or vmagent down.
      # When the link returns, vmagent replays its buffer and this resolves by itself.
      - alert: ProdMetricsAbsent
        expr: absent_over_time(up{cluster="prod", job="vmagent"}[5m])
        for: 2m
        labels: { severity: critical, cluster: prod }
        annotations:
          summary: "No metrics from vn1-01 for 7m"
          description: "Check in order: ping 13.140.183.90 (blackbox-icmp), `wg show` on both hosts, `kubectl -n monitoring get pods` on vn1-01."

      - alert: VmagentRemoteWriteBacklog
        expr: max by (cluster) (vmagent_remotewrite_pending_data_bytes) > 100e6
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "vmagent on {{ $labels.cluster }} has {{ $value | humanize1024 }}B queued"
          description: "Hub unreachable or too slow. Buffer limit is 1.5GB; beyond that the oldest data is dropped."

      - alert: VmagentDroppingData
        expr: sum by (cluster) (increase(vmagent_remotewrite_packets_dropped_total[10m])) > 0
        labels: { severity: critical }
        annotations:
          summary: "vmagent on {{ $labels.cluster }} is dropping samples (buffer full)"

      - alert: ScrapeTargetDown
        expr: up{job!~"blackbox-.*"} == 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Target down: {{ $labels.job }} {{ $labels.instance }} ({{ $labels.cluster }})"

      - alert: AlertmanagerNotificationsFailing
        expr: sum by (integration) (increase(alertmanager_notifications_failed_total[15m])) > 0
        labels: { severity: critical }
        annotations:
          summary: "Alertmanager failed to deliver via {{ $labels.integration }}"
          description: "Check bot token / chat_id / healthchecks URL. `docker compose logs alertmanager`."

      - alert: VmalertRuleErrors
        expr: sum by (group) (increase(vmalert_alerting_rules_errors_total[15m]) + increase(vmalert_recording_rules_errors_total[15m])) > 0
        labels: { severity: warning }
        annotations:
          summary: "vmalert rule evaluation errors in group {{ $labels.group }}"
