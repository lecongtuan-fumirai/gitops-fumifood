# Host alerts for both machines (node-exporter). Distinguish by {cluster, node}.
groups:
  - name: node
    interval: 30s
    rules:
      - alert: HostMemoryCritical
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.08
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.node }}: only {{ $value | humanizePercentage }} RAM available"
          description: "OOM killer / kubelet eviction is imminent. Find top consumers in Grafana (Kubernetes / Pods or cAdvisor dashboard) or `ps aux --sort=-rss | head`."

      - alert: HostMemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.15
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.node }}: {{ $value | humanizePercentage }} RAM available"

      - alert: HostSwapHeavy
        expr: (1 - node_memory_SwapFree_bytes / node_memory_SwapTotal_bytes) > 0.5 and node_memory_SwapTotal_bytes > 0
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.node }}: {{ $value | humanizePercentage }} of swap used (sustained memory pressure)"

      - alert: HostOOMKill
        expr: increase(node_vmstat_oom_kill[10m]) > 0
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.node }}: kernel OOM killer fired {{ $value | humanize }} time(s) in 10m"

      - alert: HostDiskCritical
        expr: |
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes < 0.08
          and node_filesystem_readonly == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.node }}: {{ $labels.mountpoint }} has {{ $value | humanizePercentage }} free"

      - alert: HostDiskLow
        expr: |
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes < 0.20
          and node_filesystem_readonly == 0
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.node }}: {{ $labels.mountpoint }} has {{ $value | humanizePercentage }} free"

      - alert: HostDiskWillFillIn24h
        expr: |
          predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}[6h], 24 * 3600) < 0
          and node_filesystem_avail_bytes / node_filesystem_size_bytes < 0.40
          and node_filesystem_readonly == 0
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.node }}: {{ $labels.mountpoint }} will be full within 24h at the current rate"

      - alert: HostCPUHigh
        expr: 1 - avg by (cluster, node) (rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.90
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.node }}: CPU {{ $value | humanizePercentage }} busy for 15m"

      # Noisy neighbour on the VPS host: you pay for vCPUs you do not get.
      - alert: HostCPUSteal
        expr: avg by (cluster, node) (rate(node_cpu_seconds_total{mode="steal"}[5m])) > 0.15
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.node }}: {{ $value | humanizePercentage }} CPU steal (provider oversubscription)"

      - alert: HostIOWaitHigh
        expr: avg by (cluster, node) (rate(node_cpu_seconds_total{mode="iowait"}[5m])) > 0.25
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.node }}: {{ $value | humanizePercentage }} iowait (slow disk)"

      - alert: HostConntrackNearLimit
        expr: node_nf_conntrack_entries / node_nf_conntrack_entries_limit > 0.80
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.node }}: conntrack table {{ $value | humanizePercentage }} full"

      # WireGuard handshakes and TLS both break on clock drift
      - alert: HostClockSkew
        expr: abs(node_timex_offset_seconds) > 0.05 or node_timex_sync_status == 0
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.node }}: clock not synchronised"

      - alert: HostRebooted
        expr: node_time_seconds - node_boot_time_seconds < 600
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.node }} rebooted {{ $value | humanizeDuration }} ago"
