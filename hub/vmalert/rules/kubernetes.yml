# Kubernetes alerts for vn1-01 (kube-state-metrics + kubelet/cAdvisor via vmagent).
groups:
  - name: kubernetes
    interval: 30s
    rules:
      - alert: KubeNodeNotReady
        expr: kube_node_status_condition{condition="Ready", status="true"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "K8s node {{ $labels.node }} is NotReady"

      - alert: KubeNodePressure
        expr: kube_node_status_condition{condition=~"MemoryPressure|DiskPressure|PIDPressure", status="true"} == 1
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "K8s node {{ $labels.node }} has {{ $labels.condition }} (kubelet is evicting pods)"

      - alert: KubePodCrashLoopingProd
        expr: max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff", namespace=~".*-prod"}[5m]) >= 1
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) is crash looping"
          description: "kubectl -n {{ $labels.namespace }} logs {{ $labels.pod }} -c {{ $labels.container }} --previous"

      - alert: KubePodCrashLooping
        expr: max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff", namespace!~".*-prod"}[5m]) >= 1
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) is crash looping"

      - alert: KubeContainerOOMKilled
        expr: |
          (kube_pod_container_status_restarts_total - kube_pod_container_status_restarts_total offset 10m >= 1)
          and ignoring (reason)
          min_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m]) == 1
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) was OOMKilled"
          description: "Container hit its memory limit. Raise the limit or fix the leak."

      - alert: KubeImagePullFailing
        expr: max_over_time(kube_pod_container_status_waiting_reason{reason=~"ImagePullBackOff|ErrImagePull|CreateContainerConfigError"}[5m]) >= 1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }}: {{ $labels.reason }}"

      - alert: KubePodNotReady
        expr: |
          sum by (namespace, pod) (
            max by (namespace, pod) (kube_pod_status_phase{phase=~"Pending|Unknown|Failed"})
            * on (namespace, pod) group_left (owner_kind)
            topk by (namespace, pod) (1, max by (namespace, pod, owner_kind) (kube_pod_owner{owner_kind!="Job"}))
          ) > 0
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} not ready for 15m"

      - alert: KubeDeploymentReplicasMismatch
        expr: |
          kube_deployment_spec_replicas != kube_deployment_status_replicas_available
          and changes(kube_deployment_status_replicas_updated[10m]) == 0
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }}: available replicas != desired"

      - alert: KubeStatefulSetReplicasMismatch
        expr: kube_statefulset_status_replicas_ready != kube_statefulset_replicas
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "StatefulSet {{ $labels.namespace }}/{{ $labels.statefulset }}: ready replicas != desired"

      - alert: KubeDaemonSetNotScheduled
        expr: kube_daemonset_status_desired_number_scheduled - kube_daemonset_status_number_ready > 0
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "DaemonSet {{ $labels.namespace }}/{{ $labels.daemonset }} has unready pods"

      - alert: KubeJobFailed
        expr: kube_job_status_failed > 0
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Job {{ $labels.namespace }}/{{ $labels.job_name }} failed"

      # Early warning before OOMKilled
      - alert: KubeContainerNearMemoryLimit
        expr: |
          max by (namespace, pod, container) (container_memory_working_set_bytes{container!="", container!="POD"})
          / on (namespace, pod, container)
          max by (namespace, pod, container) (kube_pod_container_resource_limits{resource="memory"})
          > 0.90
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) at {{ $value | humanizePercentage }} of its memory limit"

      # Namespaces have hard ResourceQuotas: a full quota silently blocks deploys
      - alert: KubeQuotaAlmostFull
        expr: |
          kube_resourcequota{type="used"}
          / ignoring (type) (kube_resourcequota{type="hard"} > 0)
          > 0.90
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Quota {{ $labels.namespace }}/{{ $labels.resource }} at {{ $value | humanizePercentage }}"
          description: "New pods / rollouts in {{ $labels.namespace }} may be rejected."

      - alert: KubeAPIServerErrors
        expr: |
          sum(rate(apiserver_request_total{code=~"5.."}[5m]))
          / sum(rate(apiserver_request_total[5m])) > 0.05
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "kube-apiserver 5xx ratio {{ $value | humanizePercentage }}"
