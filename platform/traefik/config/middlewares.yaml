# Same headers the host nginx vhosts used to add.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: traefik
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    contentTypeNosniff: true
    frameDeny: false
    customFrameOptionsValue: SAMEORIGIN
    referrerPolicy: strict-origin-when-cross-origin
---
# General rate limiting for public web services - Relaxed 5x for stress testing (500 req/s, burst 250) per client IP
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit
  namespace: traefik
spec:
  rateLimit:
    average: 500
    burst: 250
    period: 1s
    sourceCriterion:
      requestHeaderName: CF-Connecting-IP
