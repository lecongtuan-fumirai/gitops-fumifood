# Traefik (chart 41.x / Traefik v3.7). Single replica, LoadBalancer via k3s klipper svclb.
#
# MIGRATION STATE: "transition"
#   Host nginx still owns :80/:443 and forwards to Traefik on :8080 (HTTP).
#   Phase 5 cutover PR: set web.exposedPort=80, websecure.exposedPort=443 and
#   enable the web -> websecure redirection (see commented block).
deployment:
  replicas: 1
priorityClassName: platform-critical

resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { memory: 192Mi }

service:
  type: LoadBalancer
  spec:
    externalTrafficPolicy: Local          # preserve client source IP

ingressClass:
  enabled: true
  isDefaultClass: true

providers:
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: true             # shared Middleware traefik/security-headers
  kubernetesIngress:
    enabled: true
    publishedService:
      enabled: true

ingressRoute:
  dashboard:
    enabled: false

log:
  level: INFO
# accessLog: left at chart default (disabled) to save CPU/IO

ports:
  web:
    port: 8000
    exposedPort: 80                       # Phase 5 cutover: 80
    forwardedHeaders:
      trustedIPs:
        - "127.0.0.1/32"
        - "10.42.0.0/16"
        - "13.140.183.90/32"
        # Cloudflare IPv4
        - "173.245.48.0/20"
        - "103.21.244.0/22"
        - "103.22.200.0/22"
        - "103.31.4.0/22"
        - "141.101.64.0/18"
        - "108.162.192.0/18"
        - "190.93.240.0/20"
        - "188.114.96.0/20"
        - "197.234.240.0/22"
        - "198.41.128.0/17"
        - "162.158.0.0/15"
        - "104.16.0.0/13"
        - "104.24.0.0/14"
        - "172.64.0.0/13"
        - "131.0.72.0/22"
        # Cloudflare IPv6
        - "2400:cb00::/32"
        - "2606:4700::/32"
        - "2803:f800::/32"
        - "2405:b500::/32"
        - "2405:8100::/32"
        - "2a06:98c0::/29"
        - "2c0f:f248::/32"
    transport:
      respondingTimeouts:
        readTimeout: 60s
        writeTimeout: 60s
        idleTimeout: 180s
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    port: 8443
    exposedPort: 443                      # Phase 5 cutover: 443
    forwardedHeaders:
      trustedIPs:
        - "127.0.0.1/32"
        - "10.42.0.0/16"
        - "13.140.183.90/32"
        # Cloudflare IPv4
        - "173.245.48.0/20"
        - "103.21.244.0/22"
        - "103.22.200.0/22"
        - "103.31.4.0/22"
        - "141.101.64.0/18"
        - "108.162.192.0/18"
        - "190.93.240.0/20"
        - "188.114.96.0/20"
        - "197.234.240.0/22"
        - "198.41.128.0/17"
        - "162.158.0.0/15"
        - "104.16.0.0/13"
        - "104.24.0.0/14"
        - "172.64.0.0/13"
        - "131.0.72.0/22"
        # Cloudflare IPv6
        - "2400:cb00::/32"
        - "2606:4700::/32"
        - "2803:f800::/32"
        - "2405:b500::/32"
        - "2405:8100::/32"
        - "2a06:98c0::/29"
        - "2c0f:f248::/32"
    http:
      tls:
        enabled: true
    transport:
      respondingTimeouts:
        readTimeout: 60s
        writeTimeout: 60s
        idleTimeout: 180s

securityContext:
  allowPrivilegeEscalation: false
  capabilities: { drop: [ALL] }
  readOnlyRootFilesystem: true
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile: { type: RuntimeDefault }
