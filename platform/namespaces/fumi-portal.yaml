# ---------------------------------------------------------------------------
# fumi-portal-prod
# Owned by the platform (AppProject "apps" may not create Namespaces, quotas or
# NetworkPolicies).
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: fumi-portal-prod
  labels:
    env: production
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: fumi-portal-prod
spec:
  limits:
    - type: Container
      defaultRequest: { cpu: 15m, memory: 32Mi }
      default: { cpu: 200m, memory: 128Mi }
      max: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota
  namespace: fumi-portal-prod
spec:
  hard:
    requests.cpu: "300m"
    requests.memory: 256Mi
    limits.cpu: "800m"
    limits.memory: 512Mi
    pods: "6"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: fumi-portal-prod
automountServiceAccountToken: false
---
# ---------------------------------------------------------------------------
# Zero-trust networking: default deny all ingress & egress
# ---------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: fumi-portal-prod
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# Allow egress to CoreDNS in kube-system
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: fumi-portal-prod
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# Traefik ingress -> Frontend & Backend pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-from-traefik
  namespace: fumi-portal-prod
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - { protocol: TCP, port: 8080 }
---
# Intra-namespace: Frontend -> Backend
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-backend
  namespace: fumi-portal-prod
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: backend
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: frontend
      ports:
        - { protocol: TCP, port: 8080 }
---
# Frontend egress -> Backend
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-egress
  namespace: fumi-portal-prod
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: frontend
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: backend
      ports:
        - { protocol: TCP, port: 8080 }
