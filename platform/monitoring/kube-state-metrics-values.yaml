# kube-state-metrics 8.6.0 (v2.20.0)
# Object state: pod phase/restarts, OOMKilled reasons, deployment replicas,
# PVC status. Needed for CrashLoop / replicas-unavailable alerts.
priorityClassName: platform-critical

resources:
  requests: { cpu: 10m, memory: 40Mi }
  limits: { memory: 128Mi }

# Only what the alerts and dashboards use. Dropping secrets/configmaps/leases/
# webhooks etc. keeps memory and series count low.
collectors:
  - cronjobs
  - daemonsets
  - deployments
  - jobs
  - namespaces
  - nodes
  - persistentvolumeclaims
  - persistentvolumes
  - pods
  - replicasets
  - resourcequotas
  - services
  - statefulsets

# Expose app.kubernetes.io/name so dashboards can group by app
metricLabelsAllowlist:
  - pods=[app.kubernetes.io/name]
  - deployments=[app.kubernetes.io/name]

selfMonitor:
  enabled: false

prometheus:
  monitor:
    enabled: false
