# Argo CD values – minimal footprint for a single 3.8GB node.
# Used both by bootstrap/bootstrap.sh (first install) and by the self-managed
# Application platform/argocd (afterwards). Keep them identical.
global:
  priorityClassName: platform-critical

crds:
  keep: true

dex:
  enabled: false
notifications:
  enabled: true
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 64Mi }
  secret:
    create: false
  cm:
    create: true
    data:
      service.telegram: |
        token: $telegram-token

      template.app-deployed: |
        message: |
          ✅ [CD SUCCESS] Pod Rollout Complete!
          • Application: {{.app.metadata.name}}
          • Health: {{.app.status.health.status}}
          • Sync: {{.app.status.sync.status}}
          • Revision: {{.app.status.sync.revision | trunc 7}}
          {{- if .app.status.summary.images }}
          • Images:
          {{- range .app.status.summary.images }}
            - {{ . }}
          {{- end }}
          {{- end }}

      template.app-failed: |
        message: |
          🚨 [CD FAILED] Pod Rollout / Deployment Issue!
          • Application: {{.app.metadata.name}}
          • Health: {{.app.status.health.status}}
          • Sync: {{.app.status.sync.status}}
          • Revision: {{.app.status.sync.revision | trunc 7}}
          • Details: {{.app.status.operationState.message}}
          {{- if .app.status.operationState.syncResult.resources }}
          • Issues:
          {{- range .app.status.operationState.syncResult.resources }}
          {{- if and (ne .status "Synced") (ne .hookPhase "Running") }}
            - {{.kind}}/{{.name}}: {{.message}}
          {{- end }}
          {{- end }}
          {{- end }}

      trigger.on-deployed: |
        - description: Application is synced and healthy (pod rollout done)
          send: [app-deployed]
          when: app.status.operationState != nil and app.status.operationState.phase in ['Succeeded'] and app.status.health.status == 'Healthy'
          oncePer: app.status.sync.revision

      trigger.on-health-degraded: |
        - description: Application health degraded (pod crashed/failed)
          send: [app-failed]
          when: app.status.health.status == 'Degraded'

      trigger.on-sync-failed: |
        - description: Application sync failed
          send: [app-failed]
          when: app.status.operationState != nil and app.status.operationState.phase in ['Error', 'Failed']
applicationSet:
  replicas: 1
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 96Mi }

configs:
  cm:
    admin.enabled: "true"
    exec.enabled: "false"
    statusbadge.enabled: "false"
    timeout.reconciliation: 300s
    kustomize.buildOptions: "--enable-alpha-plugins --enable-exec"
    # Ignore noise that would otherwise flap apps OutOfSync
    resource.exclusions: |
      - apiGroups: ["cilium.io", "velero.io"]
        kinds: ["*"]
        clusters: ["*"]
  params:
    server.insecure: true                  # UI reached only through SSH tunnel
    controller.status.processors: 10
    controller.operation.processors: 5
    controller.repo.server.timeout.seconds: 120
    reposerver.parallelism.limit: 2        # cap concurrent renders => cap RAM spikes

redis:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 96Mi }

server:
  replicas: 1
  resources:
    requests: { cpu: 20m, memory: 48Mi }
    limits: { memory: 192Mi }

controller:
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 192Mi }
    limits: { memory: 512Mi }

repoServer:
  replicas: 1
  resources:
    requests: { cpu: 30m, memory: 96Mi }
    limits: { memory: 384Mi }
  env:
    - name: SOPS_AGE_KEY_FILE
      value: /sops/age/keys.txt
    - name: XDG_CONFIG_HOME
      value: /.config
  volumes:
    - name: custom-tools
      emptyDir: {}
    - name: sops-age
      secret:
        secretName: sops-age
  initContainers:
    - name: install-ksops
      image: viaductoss/ksops:v4.5.1
      command: ["/usr/local/bin/ksops", "install", "--with-kustomize", "/custom-tools"]
      volumeMounts:
        - mountPath: /custom-tools
          name: custom-tools
  volumeMounts:
    - mountPath: /usr/local/bin/kustomize
      name: custom-tools
      subPath: kustomize
    - mountPath: /usr/local/bin/ksops
      name: custom-tools
      subPath: ksops
    - mountPath: /sops/age
      name: sops-age
      readOnly: true
