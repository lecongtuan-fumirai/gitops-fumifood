---
# ---------------------------------------------------------------------------
# Swap: safety net for host processes (k3s, containerd). Pods do not use swap
# (kubelet swapBehavior=NoSwap) and stay bound by their memory limits.
# ---------------------------------------------------------------------------
- name: Check active swap
  ansible.builtin.command: swapon --show=NAME --noheadings
  register: swap_active
  changed_when: false
  check_mode: false

- name: Create swap file
  ansible.builtin.command: "fallocate -l {{ swap_size_mb }}M {{ swap_file }}"
  args:
    creates: "{{ swap_file }}"
  register: swap_created

- name: Secure swap file permissions
  ansible.builtin.file:
    path: "{{ swap_file }}"
    mode: "0600"
    owner: root
    group: root
  when: not (ansible_check_mode and swap_created is changed)

- name: Format swap file
  ansible.builtin.command: "mkswap {{ swap_file }}"
  when: swap_created is changed

- name: Enable swap
  ansible.builtin.command: "swapon {{ swap_file }}"
  when: swap_file not in swap_active.stdout

- name: Persist swap in fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^{{ swap_file }}\s'
    line: "{{ swap_file }} none swap sw 0 0"

# ---------------------------------------------------------------------------
# Kernel modules & sysctl for Kubernetes
# ---------------------------------------------------------------------------
- name: Persist kernel modules
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    mode: "0644"
    content: |
      overlay
      br_netfilter
      wireguard

- name: Load kernel modules
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop: [overlay, br_netfilter, wireguard]

- name: Kubernetes sysctl tuning
  ansible.builtin.copy:
    dest: /etc/sysctl.d/90-k8s.conf
    mode: "0644"
    content: |
      # Managed by Ansible (platform-gitops/ansible/roles/hardening)
      vm.swappiness = 10
      vm.overcommit_memory = 1
      vm.panic_on_oom = 0
      kernel.panic = 10
      kernel.panic_on_oops = 1
      fs.inotify.max_user_instances = 8192
      fs.inotify.max_user_watches = 524288
      net.ipv4.ip_forward = 1
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
  notify: Reload sysctl

# ---------------------------------------------------------------------------
# Logging limits
# ---------------------------------------------------------------------------
- name: Journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: "0755"

- name: Limit journald disk usage
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/limit.conf
    mode: "0644"
    content: |
      [Journal]
      SystemMaxUse={{ journald_max_use }}
      MaxRetentionSec={{ journald_retention }}
  notify: Restart journald

# ---------------------------------------------------------------------------
# Patching & brute-force protection
# ---------------------------------------------------------------------------
- name: Install baseline packages
  ansible.builtin.apt:
    name: [fail2ban, unattended-upgrades, sqlite3, jq, curl, wireguard-tools]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Unattended upgrades - security only, never auto-reboot
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52platform-unattended
    mode: "0644"
    content: |
      Unattended-Upgrade::Automatic-Reboot "false";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";

- name: fail2ban sshd jail
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/sshd.local
    mode: "0644"
    content: |
      [sshd]
      enabled = true
      maxretry = 5
      findtime = 10m
      bantime = 1h
  notify: Restart fail2ban

- name: Enable fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started

# ---------------------------------------------------------------------------
# Firewall (opt-in: -e ufw_enable=true). Rules are added before enabling.
# ---------------------------------------------------------------------------
- name: Firewall rules
  when: ufw_enable | bool
  block:
    - name: Allow SSH
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp
        from_ip: "{{ item }}"
      loop: "{{ ufw_ssh_sources }}"

    - name: Allow public web ports
      community.general.ufw:
        rule: allow
        port: "{{ item | string }}"
        proto: tcp
      loop: "{{ ufw_public_tcp_ports }}"

    - name: Allow pod and service CIDRs (input)
      community.general.ufw:
        rule: allow
        from_ip: "{{ item }}"
      loop: ["{{ k3s_cluster_cidr }}", "{{ k3s_service_cidr }}"]

    - name: Allow pod and service CIDRs (routed)
      community.general.ufw:
        rule: allow
        route: true
        from_ip: "{{ item }}"
      loop: ["{{ k3s_cluster_cidr }}", "{{ k3s_service_cidr }}"]

    - name: Default deny incoming
      community.general.ufw:
        default: deny
        direction: incoming

    - name: Enable UFW
      community.general.ufw:
        state: enabled
