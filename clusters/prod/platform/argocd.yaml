# Argo CD manages itself after bootstrap. Chart version + values must match
# bootstrap/bootstrap.sh to avoid a disruptive first self-sync.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  # no finalizer: deleting this Application must never uninstall Argo CD
spec:
  project: platform
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 10.9.6
      helm:
        releaseName: argocd
        valueFiles: [$values/platform/argocd/values.yaml]
    - repoURL: git@github.com:lecongtuan-fumirai/gitops-fumifood.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ServerSideApply=true]
