# Every directory apps/<app>/overlays/<env> becomes Application "<app>-<env>"
# deployed into namespace "<app>-<env>" (production => "<app>-prod").
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: git@github.com:lecongtuan-fumirai/gitops-fumifood.git
        revision: main
        directories:
          # Only active application: expense-tracker
          - path: apps/expense-tracker/overlays/*
  syncPolicy:
    preserveResourcesOnDeletion: false
  template:
    metadata:
      name: '{{ index .path.segments 1 }}-{{ .path.basename }}'
      labels:
        app.kubernetes.io/part-of: '{{ index .path.segments 1 }}'
        env: '{{ .path.basename }}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      annotations:
        notifications.argoproj.io/subscribe.on-deployed.telegram: "-5505960288"
        notifications.argoproj.io/subscribe.on-health-degraded.telegram: "-5505960288"
        notifications.argoproj.io/subscribe.on-sync-failed.telegram: "-5505960288"
    spec:
      project: apps
      source:
        repoURL: git@github.com:lecongtuan-fumirai/gitops-fumifood.git
        targetRevision: main
        path: '{{ .path.path }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ index .path.segments 1 }}-{{ if eq .path.basename "production" }}prod{{ else }}{{ .path.basename }}{{ end }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=false # namespaces are owned by platform/namespaces
          - ServerSideApply=true
          - PruneLast=true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
