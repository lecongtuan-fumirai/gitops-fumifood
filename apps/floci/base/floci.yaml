# floci AWS emulator. Services such as Lambda/RDS/ElastiCache spawn containers,
# so the pod carries a Docker-in-Docker sidecar reachable only on 127.0.0.1:2375.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: floci
  labels: { app.kubernetes.io/name: floci }
spec:
  replicas: 1
  strategy: { type: Recreate }            # RWO volume, single writer
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app.kubernetes.io/name: floci }
  template:
    metadata:
      labels: { app.kubernetes.io/name: floci }
    spec:
      priorityClassName: workload-standard
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: floci
          image: floci                           # set by overlay (tag + digest)
          ports:
            - { name: api, containerPort: 4566 }
          env:
            - { name: DOCKER_HOST, value: tcp://127.0.0.1:2375 }
            - { name: FLOCI_PORT, value: "4566" }
            - { name: FLOCI_RUN_AS_ROOT, value: "true" }
            - { name: FLOCI_STORAGE_PERSISTENT_PATH, value: /app/data }
            - { name: FLOCI_SERVICES_UI_ENABLED, value: "false" }   # floci-ui is its own Deployment
            - { name: FLOCI_SECURITY_ALLOW_UNSAFE_NETWORK_EXPOSURE, value: "false" }
          envFrom:
            - configMapRef: { name: floci-config }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 512Mi }
          startupProbe:
            httpGet: { path: /_floci/health, port: api }
            periodSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /_floci/health, port: api }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /_floci/health, port: api }
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - { name: data, mountPath: /app/data }
        - name: dind
          image: dind                            # set by overlay (tag + digest)
          args:
            - --tls=false
            - --log-level=warn
          securityContext:
            privileged: true
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 1Gi }
          readinessProbe:
            exec: { command: ["docker", "info"] }
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 10
          volumeMounts:
            - { name: dind-storage, mountPath: /var/lib/docker }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: floci-data }
        - name: dind-storage
          emptyDir: { sizeLimit: 20Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: floci
  labels: { app.kubernetes.io/name: floci }
spec:
  selector: { app.kubernetes.io/name: floci }
  ports:
    - { name: api, port: 4566, targetPort: api }
