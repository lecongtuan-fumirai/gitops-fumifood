apiVersion: apps/v1
kind: Deployment
metadata:
  name: floci-ui
  labels: { app.kubernetes.io/name: floci-ui }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app.kubernetes.io/name: floci-ui }
  template:
    metadata:
      labels: { app.kubernetes.io/name: floci-ui }
    spec:
      priorityClassName: workload-standard
      automountServiceAccountToken: false
      containers:
        - name: floci-ui
          image: floci-ui                        # set by overlay (tag + digest)
          ports:
            - { name: http, containerPort: 4500 }
          env:
            - { name: PORT, value: "4500" }
            - { name: AWS_ENDPOINT_URL, value: http://floci:4566 }
            - { name: FLOCI_ENDPOINT, value: http://floci:4566 }
            - { name: FLOCI_HOSTNAME, value: floci }
            - { name: FLOCI_CLOUD, value: aws }
            # floci accepts any static credentials; these are emulator defaults, not secrets
            - { name: AWS_ACCESS_KEY_ID, value: test }
            - { name: AWS_SECRET_ACCESS_KEY, value: test }
            - { name: AWS_DEFAULT_REGION, value: us-east-1 }
            - { name: AWS_REGION, value: us-east-1 }
          envFrom:
            - configMapRef: { name: floci-ui-config }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 256Mi }
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 30
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: floci-ui
  labels: { app.kubernetes.io/name: floci-ui }
spec:
  selector: { app.kubernetes.io/name: floci-ui }
  ports:
    - { name: http, port: 4500, targetPort: http }
