apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fumi-portal-api
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: >-
      fumi-portal-prod-strip-portal-api@kubernetescrd,
      traefik-security-headers@kubernetescrd,
      traefik-rate-limit@kubernetescrd
    traefik.ingress.kubernetes.io/router.priority: "100"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - monevia.tech
        - www.monevia.tech
      secretName: monevia-tls
  rules:
    - host: monevia.tech
      http:
        paths:
          - path: /portal/api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 3004
    - host: www.monevia.tech
      http:
        paths:
          - path: /portal/api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 3004
---
