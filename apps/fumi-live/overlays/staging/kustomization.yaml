apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fumi-live-staging
resources:
  - ../../base
  - strip-prefix-middleware.yaml
configMapGenerator:
  - name: fumi-live-config
    behavior: merge
    literals:
      - STT_PROVIDER=soniox
      - TRANSLATE_PROVIDERS=claude,groq
      - TRANSLATE_FIRST_TOKEN_TIMEOUT_MS=3000
      - MAX_SESSIONS=10
      - MAX_CLIENTS_PER_MEETING=25
      - GROQ_MODEL=qwen/qwen3.8-27b
      - CLAUDE_MODEL=claude-haiku-4-5-20251001
      - PERSIST_TRANSCRIPTS=on
      - PROJECT_MEMORY=on
      - PROJECT_MEMORY_API=on
      - PROJECT_MEMORY_MIN_UTTERANCES=5
      - CONTEXT_SUMMARY=on
      - GOOGLE_AUTH_ENABLED=true
      - GOOGLE_CLIENT_ID=141718488174-fk8nfu14bnhsd0fd0vfsm768u88jbfu5.apps.googleusercontent.com
      - GOOGLE_ALLOWED_DOMAIN=fumirai.ltd
images:
  # Temporary: uses current build image. Replace tag + digest when feat/multi-target-room image is ready!
  - name: fumi-live-gateway
    newName: ghcr.io/fumirai-ltd/fumi-live-gateway
    newTag: sha-09bca18
    digest: sha256:fbc6449341e3feb25e3d6d9299c8edf2d1cbdd849fd7fea7657cb2aa522bf148
patches:
  - target: {kind: Ingress, name: fumi-live}
    patch: |-
      - { op: replace, path: /spec/rules/0/host, value: fumifood.dpdns.org }
      - { op: replace, path: /spec/tls/0/hosts/0, value: fumifood.dpdns.org }
      - { op: replace, path: /spec/rules/0/http/paths/0/path, value: /staging/ws }
      - { op: replace, path: /spec/rules/0/http/paths/1/path, value: /staging/healthz }
      - { op: replace, path: /spec/rules/0/http/paths/2/path, value: /staging/projects }
      - { op: replace, path: /spec/rules/0/http/paths/3/path, value: /staging/auth }
      - { op: add, path: /metadata/annotations/traefik.ingress.kubernetes.io~1router.middlewares, value: "fumi-live-staging-strip-prefix@kubernetescrd, traefik-security-headers@kubernetescrd" }
  - target: {kind: Deployment, name: fumi-live-gateway}
    patch: |-
      - { op: replace, path: /spec/replicas, value: 1 }
      - { op: replace, path: /spec/template/spec/priorityClassName, value: workload-standard }
