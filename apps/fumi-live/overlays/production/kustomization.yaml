apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fumi-live-prod
resources:
  - ../../base
  # - migrate-job.yaml
configMapGenerator:
  - name: fumi-live-config
    behavior: merge
    literals:
      - STT_PROVIDER=deepgram
      - TRANSLATE_PROVIDERS=groq,claude
      - TRANSLATE_FIRST_TOKEN_TIMEOUT_MS=3000
      - MAX_SESSIONS=20
      - MAX_CLIENTS_PER_MEETING=50
      - GROQ_MODEL=qwen/qwen3.8-27b
      - CLAUDE_MODEL=claude-haiku-4-5-20251001
      - PERSIST_TRANSCRIPTS=false
      - GOOGLE_AUTH_ENABLED=false
      - GOOGLE_CLIENT_ID=
      - GOOGLE_ALLOWED_DOMAIN=fumirai.ltd
# generators:
#   - secret-generator.yaml
images:
  # Promotion = updated automatically by .github/workflows/release.yml or via reviewed PR.
  # Always tag + digest of the SAME build.
  - name: fumi-live-gateway
    newName: ghcr.io/fumirai-ltd/fumi-live-gateway
    newTag: sha-43c7f48
    digest: sha256:759c163f321943fbcaeb45696de617568a8ebd9382965cd0c72d304bed2a8461
    # - name: fumi-live-migrator
    #   newName: ghcr.io/fumirai-ltd/fumi-live-migrator
    #   newTag: v0.1.0
    #   digest: sha256:...
patches:
  - target: {kind: Ingress, name: fumi-live}
    patch: |-
      - { op: replace, path: /spec/rules/0/host, value: fumifood.dpdns.org }
      - { op: replace, path: /spec/tls/0/hosts/0, value: fumifood.dpdns.org }
  - target: {kind: Deployment, name: fumi-live-gateway}
    patch: |-
      - { op: replace, path: /spec/template/spec/priorityClassName, value: workload-prod }
