# Vite SPA served by nginx. Runs non-root (uid 101) under PSA "restricted":
# the safe sysctl ip_unprivileged_port_start=0 lets it bind :80 without caps.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels: { app.kubernetes.io/name: frontend }
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app.kubernetes.io/name: frontend }
  template:
    metadata:
      labels: { app.kubernetes.io/name: frontend }
    spec:
      priorityClassName: workload-standard
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: { type: RuntimeDefault }
        sysctls:
          - { name: net.ipv4.ip_unprivileged_port_start, value: "0" }
      containers:
        - name: frontend
          image: fumirai-lunch-frontend           # set by overlay (tag + digest)
          ports:
            - { name: http, containerPort: 80 }
          env:
            - { name: NODE_ENV, value: "production" }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: run, mountPath: /var/run }
            - { name: tmp, mountPath: /tmp }
            - { name: fe-env, mountPath: /usr/share/nginx/html/env.js, subPath: env.js, readOnly: true }
      volumes:
        - { name: cache, emptyDir: { sizeLimit: 64Mi } }
        - { name: run, emptyDir: { medium: Memory, sizeLimit: 1Mi } }
        - { name: tmp, emptyDir: { sizeLimit: 64Mi } }
        - { name: fe-env, configMap: { name: fumirai-lunch-frontend-env } }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels: { app.kubernetes.io/name: frontend }
spec:
  selector: { app.kubernetes.io/name: frontend }
  ports:
    - { name: http, port: 80, targetPort: http }
