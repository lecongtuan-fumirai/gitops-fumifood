# NestJS + Prisma backend.
# - Service MUST be named "backend": FE nginx.conf hardcodes proxy_pass http://backend:3001
# - replicas MUST stay 1: in-process @Cron (menu-reminder.scheduler.ts) and Socket.IO
#   without Redis adapter cannot run multiple instances safely.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels: { app.kubernetes.io/name: backend }
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app.kubernetes.io/name: backend }
  template:
    metadata:
      labels: { app.kubernetes.io/name: backend }
    spec:
      priorityClassName: workload-standard
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: backend
          image: fumirai-lunch-backend            # set by overlay (tag + digest)
          ports:
            - { name: http, containerPort: 3001 }
          env:
            - { name: PORT, value: "3001" }
            - { name: NODE_ENV, value: "production" }
            - { name: NODE_OPTIONS, value: "--max-old-space-size=384" }
            - { name: DEV_MODE, value: "false" }
            - { name: TOTAL_EMPLOYEES, value: "100" }
          envFrom:
            - secretRef: { name: fumirai-lunch-env }
          resources:
            requests: { cpu: 150m, memory: 256Mi }
            limits: { memory: 512Mi }
          startupProbe:                           # tolerate Neon cold start
            httpGet: { path: /health, port: http }
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:                          # deliberately lenient
            httpGet: { path: /health, port: http }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }          # multer uploads (menu images, bank statements)
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels: { app.kubernetes.io/name: backend }
spec:
  selector: { app.kubernetes.io/name: backend }
  ports:
    - { name: http, port: 3001, targetPort: http }
