apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fumirai-lunch
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: traefik-security-headers@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [HOST_PLACEHOLDER]
      secretName: fumirai-lunch-tls
  rules:
    - host: HOST_PLACEHOLDER
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: backend, port: { name: http } } }
          - path: /socket.io
            pathType: Prefix
            backend: { service: { name: backend, port: { name: http } } }
          - path: /health
            pathType: Prefix
            backend: { service: { name: backend, port: { name: http } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: frontend, port: { name: http } } }
