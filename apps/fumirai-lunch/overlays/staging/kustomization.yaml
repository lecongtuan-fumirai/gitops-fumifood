apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fumirai-lunch-staging
# DISABLED in clusters/prod/apps-appset.yaml until:
#   1. Neon branch "staging" exists -> DATABASE_URL in secrets.enc.yaml
#   2. DNS staging-fumifood.dpdns.org -> 13.140.183.90
#   3. Google OAuth callback https://staging-fumifood.dpdns.org/api/auth/google/callback added
resources:
  - ../../base
  - frontend-env.yaml
generators:
  - secret-generator.yaml
images:
  # CI bot updates these (kustomize edit set image) on every merge to main.
  - name: fumirai-lunch-backend
    newName: docker.io/lecongtuan/fumirai-lunch-backend
    newTag: latest
    digest: sha256:9dc893913ad6a8f8413d4bb7ebe90933b4f3867f086a78fa24401fe58369e1af
  - name: fumirai-lunch-frontend
    newName: docker.io/lecongtuan/fumirai-lunch-frontend
    newTag: latest
    digest: sha256:96b7780ec51cf3f12f7927edbdc55bf6439726df0ea14169c86f42863ca8385d
patches:
  - target: { kind: Ingress, name: fumirai-lunch }
    patch: |-
      - { op: replace, path: /spec/rules/0/host, value: staging-fumifood.dpdns.org }
      - { op: replace, path: /spec/tls/0/hosts/0, value: staging-fumifood.dpdns.org }
  - target: { kind: Deployment, name: backend }
    patch: |-
      - { op: replace, path: /spec/template/spec/containers/0/resources, value: { requests: { cpu: 20m, memory: 96Mi }, limits: { memory: 384Mi } } }
      - { op: replace, path: /spec/template/spec/containers/0/env/2/value, value: "--max-old-space-size=256" }
