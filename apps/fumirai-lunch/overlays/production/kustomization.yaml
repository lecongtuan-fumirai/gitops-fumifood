apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fumirai-lunch-prod
resources:
  - ../../base
  - frontend-env.yaml
generators:
  - secret-generator.yaml
images:
  # Promotion = change tag+digest here via reviewed PR.
  - name: fumirai-lunch-backend
    newName: docker.io/lecongtuan/fumirai-lunch-backend
    newTag: latest
    digest: sha256:277d8e2de7a73fb28bbeb4b7405c36cf9b70d7a753c333191ff8e30ed3d3b3b0
  - name: fumirai-lunch-frontend
    newName: docker.io/lecongtuan/fumirai-lunch-frontend
    newTag: latest
    digest: sha256:eb0f663c1b88365b7f1eb0291647f6e05aa702d6cb631e47c9d2fc6580ed8dfc
patches:
  - target: {kind: Ingress, name: fumirai-lunch}
    patch: |-
      - { op: replace, path: /spec/rules/0/host, value: fumifood.dpdns.org }
      - { op: replace, path: /spec/tls/0/hosts/0, value: fumifood.dpdns.org }
  - target: {kind: Deployment}
    patch: |-
      - { op: replace, path: /spec/template/spec/priorityClassName, value: workload-prod }
