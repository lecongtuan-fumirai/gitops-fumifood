apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: fumi-portal
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app.kubernetes.io/name: fumi-portal
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fumi-portal
        app.kubernetes.io/component: frontend
    spec:
      priorityClassName: workload-prod
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: frontend
          image: docker.io/nginxinc/nginx-unprivileged:alpine-slim
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          resources:
            requests: { cpu: 15m, memory: 24Mi }
            limits: { cpu: 100m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: run, mountPath: /var/run }
            - { name: tmp, mountPath: /tmp }
            - { name: config, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true }
            - { name: html, mountPath: /usr/share/nginx/html/index.html, subPath: index.html, readOnly: true }
      volumes:
        - { name: cache, emptyDir: { sizeLimit: 32Mi } }
        - { name: run, emptyDir: { medium: Memory, sizeLimit: 2Mi } }
        - { name: tmp, emptyDir: { sizeLimit: 32Mi } }
        - { name: config, configMap: { name: frontend-nginx-config } }
        - { name: html, configMap: { name: frontend-html-content } }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: fumi-portal
    app.kubernetes.io/component: frontend
spec:
  selector:
    app.kubernetes.io/name: fumi-portal
    app.kubernetes.io/component: frontend
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-config
  labels:
    app.kubernetes.io/name: fumi-portal
    app.kubernetes.io/component: frontend
data:
  default.conf: |
    server {
        listen       8080;
        server_name  localhost;

        location /healthz {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }

        location /api/ {
            proxy_pass http://backend:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
        }

        location /portal/api/ {
            proxy_pass http://backend:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
        }

        location /portal {
            alias /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        location / {
            root   /usr/share/nginx/html;
            index  index.html;
            try_files $uri $uri/ /index.html;
        }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-html-content
  labels:
    app.kubernetes.io/name: fumi-portal
    app.kubernetes.io/component: frontend
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Fumi Portal - Microservice Cluster</title>
      <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 2rem; }
        .card { max-width: 680px; margin: 0 auto; background: #1e293b; border-radius: 12px; padding: 2rem; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
        h1 { color: #38bdf8; margin-top: 0; font-size: 1.6rem; }
        .badge { display: inline-block; padding: 0.25rem 0.6rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; background: #059669; color: #fff; margin-bottom: 1rem; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin: 1.5rem 0; }
        .box { background: #0f172a; padding: 1rem; border-radius: 8px; border: 1px solid #334155; }
        .box h3 { margin: 0 0 0.5rem 0; font-size: 0.95rem; color: #94a3b8; }
        .box p { margin: 0; font-size: 1.1rem; font-weight: 600; color: #34d399; }
        pre { background: #0f172a; padding: 1rem; border-radius: 8px; font-size: 0.85rem; color: #e2e8f0; overflow-x: auto; border: 1px solid #334155; }
        footer { margin-top: 2rem; font-size: 0.8rem; color: #64748b; text-align: center; }
      </style>
    </head>
    <body>
      <div class="card">
        <span class="badge">Production Ready</span>
        <h1>Fumi Portal Microservice Stack</h1>
        <p>Enterprise K3s Cluster Architecture & Zero-Trust Hardening</p>
        <div class="grid">
          <div class="box">
            <h3>Frontend Status</h3>
            <p>Running (UID 101)</p>
          </div>
          <div class="box">
            <h3>Backend Status</h3>
            <p id="be-status">Checking...</p>
          </div>
        </div>
        <h3>Live Backend Payload (Via Intra-Namespace CNI)</h3>
        <pre id="be-data">Connecting to backend microservice (/portal/api)...</pre>
        <footer>SRE Hardening: PSA Restricted | ReadOnly RootFS | Drop ALL Caps | WireGuard CNI</footer>
      </div>
      <script>
        fetch('/portal/api/')
          .then(res => res.text())
          .then(data => {
            document.getElementById('be-status').innerText = 'Connected (200 OK)';
            document.getElementById('be-data').innerText = data;
          })
          .catch(err => {
            document.getElementById('be-status').innerText = 'Error';
            document.getElementById('be-status').style.color = '#f87171';
            document.getElementById('be-data').innerText = err.message;
          });
      </script>
    </body>
    </html>
