apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: fumi-portal
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app.kubernetes.io/name: fumi-portal
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fumi-portal
        app.kubernetes.io/component: backend
    spec:
      priorityClassName: workload-prod
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: backend
          image: docker.io/traefik/whoami:v1.10.1
          imagePullPolicy: IfNotPresent
          args:
            - --port
            - "8080"
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - secretRef:
                name: fumi-portal-env
          resources:
            requests: { cpu: 15m, memory: 32Mi }
            limits: { cpu: 100m, memory: 96Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: fumi-portal
    app.kubernetes.io/component: backend
spec:
  selector:
    app.kubernetes.io/name: fumi-portal
    app.kubernetes.io/component: backend
  ports:
    - { name: http, port: 8080, targetPort: http }

