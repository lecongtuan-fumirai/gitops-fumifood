apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fumi-portal
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: >-
      traefik-security-headers@kubernetescrd,
      traefik-rate-limit@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - fumifood.dpdns.org
      secretName: fumi-live-tls
  rules:
    - host: fumifood.dpdns.org
      http:
        paths:
          - path: /portal/api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /portal
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 8080
